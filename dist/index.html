<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>todo app</title>
    <link rel="stylesheet" href="/todoapp.456f8b4a.css">
</head>
<body>
    
    <div id="container">

        <div id="content">
            
            <header>
                <img src="/todo.89586354.png" width="30">
                <h1>todo app</h1>
            </header>

            <!-- alerts/messages display -->
            <section id="display-alerts"></section>
            
            <!-- form input -->
            <section id="form">
                <small>* Enter text &amp; press Enter key [ ↵ ]</small>
                <input type="text" max-length="35" name="title" id="new-todo" placeholder="enter new todo">
            </section>

            <!-- dynamic content loads here -->
            <div id="app"></div>

            <footer>
                <div id="all-checkbox">
                    <input type="checkbox" id="tick-untick-all">
                    <small>All</small>
                </div>
                <div id="instruction" style="flex-basis: 300px">
                    <small></small>
                </div>
                <div id="item-count">
                    <small><span>0</span> item(s)</small>
                </div>
            </footer>

        </div>
    </div>
    
    <script type="module" src="/todoapp.42846cbd.js"></script>

</body></html>
